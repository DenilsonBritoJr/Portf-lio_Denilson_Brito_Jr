<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | Denilson Brito Junior</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <header class="header">
        <a href="index.html" class="logo">Denilson <span>Brito Junior</span></a>
        <i class="bx bx-menu" id="menu-icon"></i>
        <nav class="navbar">
            <a href="index.html">Início</a>
            <a href="projetos-api.html">Projetos API</a>
            <a href="trajetoria.html">Trajetória</a>
            <a href="contato.html" aria-current="page">Contato</a>
        </nav>
    </header>

    <section class="contact" id="contact">
        <h2 class="heading">Entre em <span>Contato</span></h2>
        
        <form action="#">
            <div class="input-box">
                <input type="text" placeholder="Nome Completo" required>
                <input type="email" placeholder="Email" required>
            </div>
            
            <div class="input-box">
                <input type="number" placeholder="Telefone">
                <input type="text" placeholder="Assunto do email">    
            </div>
            
            <textarea name="mensagem" cols="30" rows="10" placeholder="Sua Mensagem" required></textarea>
            <input type="submit" value="Enviar Mensagem" class="btn btn-filled">
        </form>
    </section>

    <footer class="footer">
        <ul class="list">
            <li><a href="index.html">Início</a></li>
            <li><a href="projetos-api.html">Projetos API</a></li>
            <li><a href="trajetoria.html">Trajetória</a></li>
            <li><a href="contato.html">Contato</a></li>
        </ul>
        <p class="copyright">Denilson Brito Junior | Todos os direitos reservados</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
